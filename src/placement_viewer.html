<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>ESO Placement Viewer</title>
        <script src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
        <style>
            :root {
                --bg: #0f1216;
                --panel: #161a20;
                --panel-2: #1d222a;
                --border: #2a303a;
                --text: #e6e9ee;
                --muted: #8892a0;
                --accent: #5ec8d8;
                --accent-2: #e8a33d;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
                display: flex;
                height: 100vh;
                overflow: hidden;
            }
            #sidebar {
                width: 300px;
                min-width: 300px;
                background: var(--panel);
                border-right: 1px solid var(--border);
                padding: 20px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 18px;
            }
            h1 {
                font-size: 15px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                margin: 0 0 2px 0;
                font-weight: 600;
            }
            h1 span { color: var(--accent); }
            .sub { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

            .drop {
                border: 1.5px dashed var(--border);
                border-radius: 8px;
                padding: 22px 14px;
                text-align: center;
                font-size: 13px;
                color: var(--muted);
                cursor: pointer;
                transition: border-color 0.15s, background 0.15s;
            }
            .drop:hover, .drop.drag { border-color: var(--accent); background: rgba(94,200,216,0.06); }
            .drop input { display: none; }
            .drop strong { color: var(--text); }

            .section {
                border-top: 1px solid var(--border);
                padding-top: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
            label.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
            input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
            input[type="range"] { width: 100%; accent-color: var(--accent); }
            select {
                background: var(--panel-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 5px 8px;
                font-size: 13px;
            }
            .stat { font-size: 12px; color: var(--muted); }
            .stat b { color: var(--text); font-weight: 600; }
            .rangeLabel { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
            #status { font-size: 12px; color: var(--accent-2); min-height: 16px; }
            #plot { flex: 1; height: 100vh; }
            #empty {
                flex: 1; display: flex; align-items: center; justify-content: center;
                color: var(--muted); font-size: 14px; text-align: center; padding: 40px;
            }
        </style>
    </head>
    <body>

        <div id="sidebar">
        <div>
            <h1>ESO <span>Placement</span> Viewer</h1>
            <div class="sub">3D instances + R-tree bounding volumes</div>
        </div>

        <div class="drop" id="drop">
            Drop JSON file here, or <strong>click to browse</strong><br>
            <span style="font-size:11px;">(output of parse_eso_placement.py)</span>
            <input type="file" id="fileInput" accept=".json,application/json">
        </div>

        <div id="status"></div>

        <div class="section" id="controls" style="display:none;">
            <div class="row"><label class="toggle"><input type="checkbox" id="showInstances" checked> Instances (points)</label></div>
            <div class="row"><label class="toggle"><input type="checkbox" id="showLeaves"> R-tree leaf boxes</label></div>
            <div class="row"><label class="toggle"><input type="checkbox" id="showNodes"> R-tree node boxes</label></div>

            <div>
                <div class="rangeLabel"><span>Max node depth drawn</span><span id="depthVal">2</span></div>
                <input type="range" id="depthSlider" min="0" max="12" value="2">
            </div>

            <div class="row">
                <label class="sub" style="margin:0;">Color instances by</label>
                <select id="colorBy">
                    <option value="model_type_id">model_type_id</option>
                    <option value="none">single color</option>
                </select>
            </div>

            <div class="row">
                <label class="sub" style="margin:0;">Point size</label>
                <input type="range" id="ptSize" min="1" max="8" value="3" style="width:120px;">
            </div>
        </div>

        <div class="section" id="statsBox" style="display:none;">
            <div class="stat">Instances: <b id="statInstances">0</b></div>
            <div class="stat">R-tree root trees: <b id="statTrees">0</b></div>
            <div class="stat">Leaf boxes (total): <b id="statLeaves">0</b></div>
            <div class="stat">Node boxes (total): <b id="statNodes">0</b></div>
        </div>
        </div>

        <div id="empty">Load a JSON file (from parse_eso_placement.py) to visualize.</div>
        <div id="plot" style="display:none;"></div>

        <script>
            let DATA = null;
            let allLeafBoxes = [];   // {bbox, object_id, depth}
            let allNodeBoxes = [];   // {bbox, level, depth}

            const dropEl = document.getElementById('drop');
            const fileInput = document.getElementById('fileInput');
            const statusEl = document.getElementById('status');

            dropEl.addEventListener('click', () => fileInput.click());
            dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
            dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
            dropEl.addEventListener('drop', e => {
            e.preventDefault();
            dropEl.classList.remove('drag');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', e => {
            if (e.target.files.length) loadFile(e.target.files[0]);
            });

            function loadFile(file) {
            statusEl.textContent = 'Reading ' + file.name + ' ...';
            const reader = new FileReader();
            reader.onload = evt => {
                try {
                const json = JSON.parse(evt.target.result);
                DATA = json;
                statusEl.textContent = 'Loaded ' + file.name;
                prepData();
                render();
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('statsBox').style.display = 'flex';
                document.getElementById('empty').style.display = 'none';
                document.getElementById('plot').style.display = 'block';
                window.dispatchEvent(new Event('resize'));
                } catch (err) {
                statusEl.textContent = 'Error parsing JSON: ' + err.message;
                }
            };
            reader.onerror = () => { statusEl.textContent = 'Error reading file.'; };
            reader.readAsText(file);
            }

            function prepData() {
            allLeafBoxes = [];
            allNodeBoxes = [];
            const trees = DATA.trees || [];
            document.getElementById('statTrees').textContent = trees.length;
            document.getElementById('statInstances').textContent = (DATA.instances || []).length;

            function walk(node, depth) {
                allNodeBoxes.push({ bbox: node.bbox, level: node.level, depth: depth });
                if (node.level === 0 && node.leaves) {
                node.leaves.forEach(l => allLeafBoxes.push({ bbox: l.bbox, object_id: l.object_id, depth: depth + 1 }));
                } else if (node.children) {
                node.children.forEach(c => walk(c, depth + 1));
                }
            }
            trees.forEach(t => walk(t, 0));

            document.getElementById('statLeaves').textContent = allLeafBoxes.length;
            document.getElementById('statNodes').textContent = allNodeBoxes.length;

            let maxDepth = 0;
            allNodeBoxes.forEach(n => { if (n.depth > maxDepth) maxDepth = n.depth; });
            const slider = document.getElementById('depthSlider');
            slider.max = Math.max(maxDepth, 1);
            slider.value = Math.min(2, maxDepth);
            document.getElementById('depthVal').textContent = slider.value;
            }

            // Build wireframe edges for a box [minx,miny,minz,maxx,maxy,maxz] as one Scatter3d line trace segment set
            function boxEdges(bbox) {
            const [x0,y0,z0,x1,y1,z1] = bbox;
            const corners = [
                [x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
                [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]
            ];
            const edges = [
                [0,1],[1,2],[2,3],[3,0],
                [4,5],[5,6],[6,7],[7,4],
                [0,4],[1,5],[2,6],[3,7]
            ];
            const xs=[], ys=[], zs=[];
            edges.forEach(([a,b]) => {
                xs.push(corners[a][0], corners[b][0], null);
                ys.push(corners[a][1], corners[b][1], null);
                zs.push(corners[a][2], corners[b][2], null);
            });
            return {xs, ys, zs};
            }

            function boxesToTrace(boxes, color, name, width) {
            let xs=[], ys=[], zs=[];
            boxes.forEach(b => {
                const e = boxEdges(b.bbox);
                xs = xs.concat(e.xs); ys = ys.concat(e.ys); zs = zs.concat(e.zs);
            });
            return {
                type: 'scatter3d', mode: 'lines', x: xs, y: ys, z: zs,
                line: { color: color, width: width || 2 },
                name: name, hoverinfo: 'skip', opacity: 0.6
            };
            }

            function render() {
            const traces = [];
            const showInstances = document.getElementById('showInstances').checked;
            const showLeaves = document.getElementById('showLeaves').checked;
            const showNodes = document.getElementById('showNodes').checked;
            const maxDepth = parseInt(document.getElementById('depthSlider').value, 10);
            const colorBy = document.getElementById('colorBy').value;
            const ptSize = parseInt(document.getElementById('ptSize').value, 10);

            if (showInstances && DATA.instances) {
                const inst = DATA.instances;
                const hover = inst.map(i =>
                'instance_id: ' + i.instance_id +
                '<br>model_type_id: ' + i.model_type_id +
                '<br>pos: (' + i.pos_x.toFixed(2) + ', ' + i.pos_y.toFixed(2) + ', ' + i.pos_z.toFixed(2) + ')' +
                '<br>rot: (' + i.rot_x.toFixed(3) + ', ' + i.rot_y.toFixed(3) + ', ' + i.rot_z.toFixed(3) + ')'
                );
                traces.push({
                type: 'scatter3d', mode: 'markers',
                x: inst.map(i => i.pos_x), y: inst.map(i => i.pos_z), z: inst.map(i => i.pos_y),
                text: hover, hoverinfo: 'text',
                marker: {
                    size: ptSize,
                    color: colorBy === 'model_type_id' ? inst.map(i => i.model_type_id) : '#5ec8d8',
                    colorscale: 'Turbo',
                    showscale: colorBy === 'model_type_id',
                    opacity: 0.85
                },
                name: 'Instances'
                });
            }

            if (showNodes) {
                const filtered = allNodeBoxes.filter(n => n.depth <= maxDepth);
                if (filtered.length) traces.push(boxesToTraceSwapAxes(filtered, '#e8a33d', 'R-tree nodes', 2));
            }
            if (showLeaves) {
                const filtered = allLeafBoxes.filter(n => n.depth <= maxDepth + 1);
                if (filtered.length) traces.push(boxesToTraceSwapAxes(filtered, '#5ec8d8', 'R-tree leaves', 1));
            }

            const layout = {
                paper_bgcolor: '#0f1216',
                plot_bgcolor: '#0f1216',
                font: { color: '#e6e9ee' },
                margin: { l: 0, r: 0, t: 10, b: 0 },
                scene: {
                xaxis: { title: 'X', gridcolor: '#2a303a', color: '#8892a0', backgroundcolor: '#0f1216' },
                yaxis: { title: 'Z', gridcolor: '#2a303a', color: '#8892a0', backgroundcolor: '#0f1216', autorange: 'reversed' },
                zaxis: { title: 'Y (up)', gridcolor: '#2a303a', color: '#8892a0', backgroundcolor: '#0f1216' },
                aspectmode: 'data'
                },
                showlegend: true,
                legend: { font: { color: '#e6e9ee' } }
            };

            Plotly.react('plot', traces, layout, { responsive: true, displaylogo: false });
            }

            // Note: game coords are (x, y-up, z) -> plot as (x, z, y) so "up" reads naturally in the 3D view
            function boxesToTraceSwapAxes(boxes, color, name, width) {
            let xs=[], ys=[], zs=[];
            boxes.forEach(b => {
                const [x0,y0,z0,x1,y1,z1] = b.bbox;
                const swapped = [x0,z0,y0,x1,z1,y1];
                const e = boxEdges(swapped);
                xs = xs.concat(e.xs); ys = ys.concat(e.ys); zs = zs.concat(e.zs);
            });
            return {
                type: 'scatter3d', mode: 'lines', x: xs, y: ys, z: zs,
                line: { color: color, width: width || 2 },
                name: name, hoverinfo: 'skip', opacity: 0.6
            };
            }

            ['showInstances','showLeaves','showNodes','colorBy','ptSize'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => { if (DATA) render(); });
            });
            document.getElementById('depthSlider').addEventListener('input', e => {
            document.getElementById('depthVal').textContent = e.target.value;
            if (DATA) render();
            });
        </script>
    </body>
</html>
